<!DOCTYPE html>
<html>

<head>
    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const error = params.get('error');

        if (code) {
            window.location = 'lightroom://com.github.richwu.lrgooglephotospublisher?code=' + encodeURIComponent(code);
        } else {
            document.write('Authorization failed: ' + (error || 'unknown error'));
        }
    </script>
</head>

<body>
    <p>Redirecting back to Lightroom…</p>
</body>

</html>
